<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Admin | Suplementos M1</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#191919;font:15px Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:18px;margin:14px 0}h1{margin:0 0 8px;font-size:1.5rem}h2{margin:0 0 10px;font-size:1.2rem}p,.help{color:#666;line-height:1.5}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:#eee;color:#222}.tab.active{background:#d71920;color:#fff}label{display:block;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;font:inherit;background:#fff}textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.three{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}button{border:0;border-radius:9px;padding:12px 15px;background:#d71920;color:#fff;font-weight:700;font-size:14px;cursor:pointer;margin:7px 5px 0 0}button:disabled{opacity:.55;cursor:wait}.secondary{background:#fff;color:#d71920;border:1px solid #d71920}.danger{background:#333}.hidden{display:none!important}.status{white-space:pre-wrap;background:#f5f5f5;border-radius:8px;padding:11px;margin-top:10px}.productrow,.catrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.thumb{width:64px;height:64px;object-fit:contain;border-radius:8px;background:#eee}.small{font-size:12px;color:#777;overflow-wrap:anywhere}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:12px}.sticky{position:sticky;bottom:0;background:#fff;padding:10px 0;border-top:1px solid #eee;margin-top:12px}@media(max-width:620px){.wrap{padding:8px}.panel{padding:13px}.row,.three{grid-template-columns:1fr}.productrow{grid-template-columns:52px minmax(0,1fr)}.thumb{width:52px;height:52px}.productrow .actions{grid-column:2}.catrow{grid-template-columns:minmax(0,1fr) auto}}
</style></head><body><main class="wrap">
<section class="panel"><h1>Suplementos M1 — Administração</h1><p>Cadastre produtos, envie fotos, gerencie categorias, preços e estoque sem editar código.</p><div id="auth"><div class="row"><div><label for="email">E-mail administrador</label><input id="email" type="email" autocomplete="username"></div><div><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password"></div></div><button id="login">Entrar</button></div><button id="logout" class="secondary hidden">Sair</button><div id="status" class="status" role="status">Entre com sua conta administrativa.</div></section>
<div id="app" class="hidden"><section class="panel"><div class="tabs"><button class="tab active" data-tab="products">Produtos</button><button class="tab" data-tab="categories">Categorias</button></div></section>
<section id="products-panel" class="panel"><h2 id="form-title">Cadastrar produto</h2><form id="product-form"><input id="product-id" type="hidden"><div class="row"><div><label for="name">Nome do produto *</label><input id="name" required maxlength="140"></div><div><label for="brand">Marca</label><input id="brand" maxlength="100"></div></div><div class="row"><div><label for="detail">Sabor / tamanho / detalhes</label><input id="detail" maxlength="180"></div><div><label for="category">Categoria *</label><select id="category" required></select></div></div><label for="description">Descrição</label><textarea id="description" maxlength="700"></textarea><div class="row"><div><label for="price">Preço (R$)</label><input id="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0,00"></div><div><label for="stock">Estoque (unidades) *</label><input id="stock" type="number" min="0" step="1" required value="0"></div></div><div class="row"><div><label for="photo">Foto do produto (JPG, PNG ou WebP, até 5 MB)</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></div><div><label for="active">Status</label><select id="active"><option value="true">Publicado</option><option value="false">Oculto</option></select></div></div><div id="current-image" class="help"></div><button type="submit" id="save-product">Salvar produto</button><button type="button" id="cancel-edit" class="secondary hidden">Cancelar edição</button></form><div class="sticky"><strong>Produtos cadastrados</strong><div id="products-list"></div></div></section>
<section id="categories-panel" class="panel hidden"><h2>Categorias</h2><form id="category-form"><input id="category-id" type="hidden"><div class="row"><div><label for="category-name">Nome da categoria *</label><input id="category-name" required maxlength="80"></div><div><label for="category-desc">Descrição</label><input id="category-desc" maxlength="220"></div></div><label for="category-active">Status</label><select id="category-active"><option value="true">Ativa</option><option value="false">Oculta</option></select><button type="submit">Salvar categoria</button><button type="button" id="cancel-category" class="secondary hidden">Cancelar</button></form><div id="categories-list"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://qtgavecqtcqchevfwuzl.supabase.co',KEY='sb_publishable_K-f7UN-mbFEHUW8MBjOF6A_8FoThUoS',BUCKET='m1-product-images';let db=null,products=[],categories=[],editingImage='';const $=id=>document.getElementById(id);const say=t=>$('status').textContent=t;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('login').onclick=async()=>{try{db=window.supabase.createClient(URL,KEY);const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('app').classList.remove('hidden');$('auth').classList.add('hidden');$('logout').classList.remove('hidden');await refresh();say('Login realizado.');}catch(e){say('Não foi possível entrar: '+e.message)}};
$('logout').onclick=async()=>{if(db)await db.auth.signOut();$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('logout').classList.add('hidden');say('Você saiu da administração.')};
async function refresh(){const [c,p,pr]=await Promise.all([db.from('catalog_categories').select('*').order('sort_order'),db.from('catalog_products').select('*').order('sort_order'),db.from('catalog_prices').select('product_id,price,stock_quantity')]);if(c.error||p.error||pr.error)throw(c.error||p.error||pr.error);categories=c.data||[];products=p.data||[];const prices=new Map((pr.data||[]).map(x=>[x.product_id,x]));renderCategories();renderProducts(prices)}
function renderCategories(){$('category').innerHTML=categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}${c.active?'':' (oculta)'}</option>`).join('');$('categories-list').innerHTML=categories.map(c=>`<div class="catrow"><div><strong>${esc(c.name)}</strong><div class="small">${esc(c.description)} · ${c.active?'Ativa':'Oculta'}</div></div><div class="actions"><button class="secondary" onclick="editCategory('${c.id}')">Editar</button><button class="danger" onclick="toggleCategory('${c.id}')">${c.active?'Ocultar':'Ativar'}</button></div></div>`).join('')}
function renderProducts(prices){$('products-list').innerHTML=products.map(p=>{const x=prices.get(p.id)||{};return `<div class="productrow"><img class="thumb" src="${esc(p.image_url||'')}" onerror="this.style.visibility='hidden'" alt=""><div><strong>${esc([p.brand,p.name].filter(Boolean).join(' · '))}</strong><div class="small">${esc(p.detail)} · ${esc(categories.find(c=>c.id===p.category_id)?.name||'Sem categoria')}</div><div class="small">Preço: ${x.price==null?'não definido':'R$ '+Number(x.price).toFixed(2).replace('.',',')} · Estoque: ${Number(x.stock_quantity)||0} · ${p.active?'Publicado':'Oculto'}</div></div><div class="actions"><button class="secondary" onclick="editProduct('${p.id}')">Editar</button><button class="danger" onclick="toggleProduct('${p.id}')">${p.active?'Ocultar':'Publicar'}</button></div></div>`}).join('')||'<p class="help">Nenhum produto cadastrado.</p>'}
function resetProduct(){$('product-form').reset();$('product-id').value='';$('stock').value='0';$('active').value='true';editingImage='';$('current-image').textContent='';$('form-title').textContent='Cadastrar produto';$('cancel-edit').classList.add('hidden')}
window.editProduct=id=>{const p=products.find(x=>x.id===id);if(!p)return;$('product-id').value=p.id;$('name').value=p.name;$('brand').value=p.brand||'';$('detail').value=p.detail||'';$('description').value=p.description||'';$('category').value=p.category_id||'';$('active').value=String(p.active);const {data}= {data:null};db.from('catalog_prices').select('price,stock_quantity').eq('product_id',p.id).maybeSingle().then(r=>{if(r.data){$('price').value=r.data.price??'';$('stock').value=r.data.stock_quantity??0}});editingImage=p.image_url||'';$('current-image').textContent=editingImage?'Foto atual: '+editingImage:'Sem foto cadastrada';$('form-title').textContent='Editar produto';$('cancel-edit').classList.remove('hidden');$('products-panel').scrollIntoView({behavior:'smooth'})};
$('cancel-edit').onclick=resetProduct;
$('product-form').onsubmit=async e=>{e.preventDefault();const save=$('save-product');save.disabled=true;try{let id=$('product-id').value||('m1-'+slug($('name').value)+'-'+crypto.randomUUID().slice(0,8));let image=editingImage;const file=$('photo').files[0];if(file){if(file.size>5*1024*1024)throw new Error('A foto deve ter até 5 MB.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Envie JPG, PNG ou WebP.');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=id+'/'+Date.now()+'.'+ext;const up=await db.storage.from(BUCKET).upload(path,file,{upsert:true,contentType:file.type});if(up.error)throw up.error;image=db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
 const row={id,name:$('name').value.trim(),brand:$('brand').value.trim(),detail:$('detail').value.trim(),description:$('description').value.trim(),image_url:image,category_id:$('category').value||null,active:$('active').value==='true',sort_order:products.find(x=>x.id===id)?.sort_order??(products.length+1),updated_at:new Date().toISOString()};const saved=await db.from('catalog_products').upsert(row,{onConflict:'id'});if(saved.error)throw saved.error;const priceText=$('price').value.trim(),price=priceText===''?0:Number(priceText),stock=Number($('stock').value);if(!Number.isFinite(price)||price<0||!Number.isInteger(stock)||stock<0)throw new Error('Confira o preço e o estoque.');const pr=await db.from('catalog_prices').upsert({product_id:id,price,stock_quantity:stock},{onConflict:'product_id'});if(pr.error)throw pr.error;resetProduct();await refresh();say('Produto salvo. Atualize o catálogo público para conferir.');}catch(err){say('Erro ao salvar produto: '+err.message)}finally{save.disabled=false}};
function slug(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70)}
window.toggleProduct=async id=>{const p=products.find(x=>x.id===id);if(!p)return;const r=await db.from('catalog_products').update({active:!p.active,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){say(r.error.message);return}await refresh();say('Status do produto atualizado.')};
$('category-form').onsubmit=async e=>{e.preventDefault();const id=$('category-id').value;const name=$('category-name').value.trim();const row={name,description:$('category-desc').value.trim(),active:$('category-active').value==='true',sort_order:categories.find(c=>c.id===id)?.sort_order??categories.length+1,updated_at:new Date().toISOString()};if(id)row.id=id;const r=await db.from('catalog_categories').upsert(row,{onConflict:'id'});if(r.error){say('Erro na categoria: '+r.error.message);return}$('category-form').reset();$('category-id').value='';$('cancel-category').classList.add('hidden');await refresh();say('Categoria salva.')};window.editCategory=id=>{const c=categories.find(x=>x.id===id);if(!c)return;$('category-id').value=c.id;$('category-name').value=c.name;$('category-desc').value=c.description||'';$('category-active').value=String(c.active);$('cancel-category').classList.remove('hidden')};$('cancel-category').onclick=()=>{$('category-form').reset();$('category-id').value='';$('cancel-category').classList.add('hidden')};window.toggleCategory=async id=>{const c=categories.find(x=>x.id===id);const r=await db.from('catalog_categories').update({active:!c.active,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){say(r.error.message);return}await refresh();say('Categoria atualizada.')};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('products-panel').classList.toggle('hidden',b.dataset.tab!=='products');$('categories-panel').classList.toggle('hidden',b.dataset.tab!=='categories')});
</script></body></html>
